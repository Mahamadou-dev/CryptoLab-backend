# Blueprint Render — infrastructure du backend CryptoLab en tant que code.
#
# Render n'heberge que l'API Python. Il n'y a pas de base a creer ici : Render
# ne propose pas de MongoDB manage, et les comptes vivent dans MongoDB Atlas,
# joint par MONGO_URI.
#
# `autoDeploy: false` : le deploiement est declenche par
# .github/workflows/deploy.yml, et seulement apres que la CI soit passee au
# vert. Sans cela, un commit rouge partirait en production.
#
# Pour une premiere mise en ligne, on peut preferer l'auto-deploy de Render :
# passer "Auto-Deploy" sur On dans le dashboard, et ne pas definir le secret
# RENDER_DEPLOY_HOOK_URL — le workflow Deploy s'ignorera alors proprement.
# Attention : une resynchronisation du Blueprint reappliquerait `false`.
# Ne jamais activer les deux, ce serait deux deploiements concurrents.
# Voir DEPLOYMENT.md.

services:
  - type: web
    name: cryptolab-api
    runtime: python
    plan: free
    region: frankfurt

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # Le deploiement passe par le hook appele depuis GitHub Actions.
    autoDeploy: false

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # Rend fatales les configurations incompletes plutot que de replier sur
      # un stockage memoire ou un secret ephemere.
      - key: CRYPTOLAB_ENV
        value: "production"

      - key: CRYPTOLAB_AUTH_DB
        value: "cryptolab_auth"

      # Secret : a generer une fois et definir dans le dashboard Render.
      #   python -c "import secrets; print(secrets.token_urlsafe(64))"
      - key: CRYPTOLAB_JWT_SECRET
        sync: false

      # Statistiques d'usage desactivees : aucun texte saisi, aucune cle et
      # aucun resultat n'est enregistre. Les comptes utilisateurs, eux, sont
      # stockes dans la base CRYPTOLAB_AUTH_DB et ne dependent pas de ce drapeau.
      - key: CRYPTOLAB_ENABLE_STATS
        value: "false"

      - key: CRYPTOLAB_ALLOWED_ORIGINS
        value: "https://cryptolaboratory.vercel.app,http://localhost:3000"

      # Secret : a definir dans le dashboard Render, jamais ici.
      # Requis en production : c'est lui qui porte la base des comptes.
      - key: MONGO_URI
        sync: false
