name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & vecteurs de reference
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        # Les statistiques restent coupees : aucun test ne doit ecrire en base.
        env:
          CRYPTOLAB_ENABLE_STATS: "false"
        run: pytest --cov=. --cov-report=term-missing

  secrets:
    name: Aucun secret commite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier qu'aucun .env n'est suivi par git
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env est suivi par git. Retirez-le et faites tourner le secret."
            exit 1
          fi
          echo "OK : aucun .env suivi."

      - name: Verifier qu'aucun fichier .idea n'est suivi
        run: |
          if git ls-files | grep -q '^\.idea/'; then
            echo "::error::Des fichiers .idea/ sont suivis par git."
            exit 1
          fi
          echo "OK : aucun fichier .idea suivi."
