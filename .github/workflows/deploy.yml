name: Deploy

# Le deploiement n'est JAMAIS declenche par un push directement : il attend que
# le workflow CI (lint + 199 tests) soit passe au vert sur master.
# Pensez a mettre "Auto-Deploy" sur Off dans le dashboard Render, sinon Render
# deploierait en parallele sans attendre la CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

# Lecture seule : le deploiement est declenche par un hook Render, jamais par le
# jeton GitHub.
permissions:
  contents: read

jobs:
  deploy:
    name: Deployer sur Render
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: ${{ vars.API_URL || 'https://cryptolab-backend.onrender.com' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Un deploiement non configure est *ignore*, pas en echec. Auparavant ce
      # garde-fou faisait echouer le job a chaque push, ce qui noyait les vraies
      # regressions sous des notifications rouges permanentes. Un depot qui
      # deploie via l'auto-deploy de Render n'a pas besoin de ce secret : le
      # workflow n'a alors rien a faire, et le dire vaut mieux que crier.
      - name: Le deploiement est-il configure ?
        id: check
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploiement ignore : le secret RENDER_DEPLOY_HOOK_URL n'est pas defini."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Declencher le deploiement
        if: steps.check.outputs.configured == 'true'
        run: |
          response=$(curl --silent --show-error --fail-with-body \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render a accepte la demande : $response"

      - name: Laisser le temps au build de demarrer
        if: steps.check.outputs.configured == 'true'
        run: sleep 60

      - name: Test de fumee sur la production
        if: steps.check.outputs.configured == 'true'
        run: python scripts/smoke_test.py "${{ vars.API_URL || 'https://cryptolab-backend.onrender.com' }}"

      - name: Resume
        if: always()
        run: |
          if [ "${{ steps.check.outputs.configured }}" != "true" ]; then
            {
              echo "### Deploiement backend — ignore"
              echo ""
              echo "Le secret \`RENDER_DEPLOY_HOOK_URL\` n'est pas defini."
              echo ""
              echo "Deux facons de mettre le backend en ligne :"
              echo ""
              echo "1. **Auto-deploy Render** — Render redeploie a chaque push."
              echo "   Simple, mais sans attendre la CI. Ce workflow reste inactif."
              echo "2. **Deploiement pilote par la CI** — Render > Settings >"
              echo "   Deploy Hook, puis GitHub > Settings > Secrets and variables >"
              echo "   Actions > \`RENDER_DEPLOY_HOOK_URL\`. Mettre Auto-Deploy sur Off."
              echo ""
              echo "Voir \`DEPLOYMENT.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Deploiement backend"
              echo ""
              echo "- Commit : \`${{ github.sha }}\`"
              echo "- Cible : ${{ vars.API_URL || 'https://cryptolab-backend.onrender.com' }}"
              echo "- Resultat : ${{ job.status }}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
